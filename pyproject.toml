[project]
name = "the-pitch-room"
version = "1.0.0"
description = "An AI executive suite that argues over your movie — backed by real box office data — and delivers a greenlight verdict."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10,<3.14"
dependencies = [
    "google-adk>=1.0.0",
    "parallel-web>=1.0.0",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
]

[project.scripts]
pitch-room = "server:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
